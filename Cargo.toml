[workspace]
resolver = "3"
members = ["crates/scanner", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Versions shared by more than one crate live here; members opt in with
# `dep.workspace = true` and add their own features. A future CLI crate reuses
# the same pins for free.
[workspace.dependencies]
tokio = "1"
futures = "0.3"
serde_json = "1.0.140"
ipnet = "2.12.0"
tracing = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
