[workspace]
resolver = "3"
members = ["crates/scanner", "crates/gui"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/JKearnsl/mc-scan"


[workspace.dependencies]
tokio = "1"
futures = "0.3"
serde_json = "1.0.140"
ipnet = "2.12.0"
tracing = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
