[package]
name = "mc-scan"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", default-features = false, features = [
    "advanced",
    "wgpu",
    "tiny-skia",
    "crisp",
    "web-colors",
    "thread-pool",
    "image",
    "svg",
    "linux-theme-detection",
    "x11",
    "wayland",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
futures = "0.3"
serde_json = "1.0.140"
ipnet = { version = "2.12.0", features = [] }
once_cell = "1.21.4"
sys-locale = "0.3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
