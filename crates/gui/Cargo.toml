[package]
name = "gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors = ["JKearnsl <boyarshinovn@gmail.com>"]
description = "iced GUI front-end for mc-scan"
build = "build.rs"

[[bin]]
name = "mc-scan"
path = "src/main.rs"

[dependencies]
scanner = { path = "../scanner" }
iced = { version = "0.14.0", default-features = false, features = [
    "advanced",
    "wgpu",
    "tiny-skia",
    "crisp",
    "web-colors",
    "thread-pool",
    "image",
    "svg",
    "linux-theme-detection",
    "x11",
    "wayland",
] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
futures.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
directories = "6"
ipnet.workspace = true
once_cell = "1.21.4"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sys-locale = "0.3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
# async-std (not tokio): rfd's tokio feature turns on zbus/tokio for the whole
# graph, which panics iced's zbus-based OS-theme detection (it runs outside a
# tokio context). async-std keeps zbus on its default async-io reactor.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
mundy = { version = "0.2.3", default-features = false, features = ["color-scheme", "async-io"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.bundle]
name = "mc-scan"
identifier = "com.jkearnsl.mc-scan"
icon = ["assets/icon.png"]
category = "Utility"
short_description = "Minecraft server scanner"
